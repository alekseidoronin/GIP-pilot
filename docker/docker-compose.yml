services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: gip_pilot
      POSTGRES_USER: gip_user
      POSTGRES_PASSWORD: gip_pass123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - default

  backend:
    build: ../backend
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://gip_user:gip_pass123@postgres:5432/gip_pilot
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    networks:
      - default
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.routers.gip-backend.rule=Host(`gip-pilot.duckdns.org`) && PathPrefix(`/api`)"
      - "traefik.http.routers.gip-backend.entrypoints=web,websecure"
      - "traefik.http.routers.gip-backend.tls=true"
      - "traefik.http.routers.gip-backend.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.gip-backend.priority=200"
      - "traefik.http.services.gip-backend.loadbalancer.server.port=3001"

  frontend:
    build: ../frontend
    env_file:
      - ../.env
    environment:
      NEXT_PUBLIC_API_URL: http://backend:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - default
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.routers.gip-frontend.rule=Host(`gip-pilot.duckdns.org`)"
      - "traefik.http.routers.gip-frontend.entrypoints=web,websecure"
      - "traefik.http.routers.gip-frontend.tls=true"
      - "traefik.http.routers.gip-frontend.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.gip-frontend.priority=100"
      - "traefik.http.services.gip-frontend.loadbalancer.server.port=3000"

volumes:
  postgres_data:

networks:
  traefik_proxy:
    external: true
    name: n8n_default
